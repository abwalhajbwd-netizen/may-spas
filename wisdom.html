<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f2f5f1">
    <title>نبذة عن الحكمة</title>
    <style>
        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 32px 24px 48px;
            color: #183b3b;
            background: #f2f5f1;
            font-family: Tahoma, Arial, sans-serif;
        }

        main {
            width: min(100%, 760px);
            margin: 0 auto;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #183b3b;
            font-size: 16px;
            font-weight: 700;
            text-decoration-thickness: 2px;
            text-underline-offset: 4px;
        }

        article {
            overflow: hidden;
            border-radius: 14px;
            background: #fff;
            box-shadow: 0 8px 28px rgb(24 59 59 / 12%);
        }

        article img {
            display: block;
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            background: #d9e2dc;
        }

        .content { padding: 24px; }

        .wisdom-details {
            padding: 20px 22px;
            border: 1px solid #dce7e1;
            border-radius: 10px;
            background: #f7faf7;
        }

        h1 {
            margin: 0 0 18px;
            font-size: clamp(26px, 5vw, 36px);
            line-height: 1.5;
        }

        blockquote {
            margin: 0 0 20px;
            padding: 18px 20px;
            border-inline-start: 5px solid #efb172;
            border-radius: 8px;
            color: #fff;
            background: #183b3b;
            font-family: "Noto Naskh Arabic", Amiri, "Traditional Arabic", serif;
            font-size: clamp(22px, 4vw, 28px);
            font-weight: 600;
            line-height: 1.8;
            text-align: center;
        }

        .wisdom-details h2 {
            display: flex;
            align-items: center;
            gap: 9px;
            margin: 0 0 12px;
            color: #183b3b;
            font-size: 23px;
            line-height: 1.5;
        }

        .wisdom-details h2::before {
            color: #b85d3b;
            content: "✦";
            font-size: 20px;
        }

        .wisdom-details p {
            margin: 0;
            color: #344f4b;
            font-size: 20px;
            font-weight: 500;
            line-height: 2;
        }

        .entry-navigation {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 22px;
        }

        .entry-navigation a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding: 10px 16px;
            border: 1px solid #183b3b;
            border-radius: 8px;
            color: #183b3b;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
        }

        .entry-navigation a:hover,
        .entry-navigation a:focus-visible {
            color: #fff;
            background: #183b3b;
        }

        .entry-navigation a[hidden] { display: none; }

        .not-found {
            padding: 24px;
            border-radius: 12px;
            background: #fff;
            font-size: 18px;
            line-height: 1.8;
        }

        @media (max-width: 640px) {
            body { padding: 20px 18px 36px; }
            .content { padding: 20px; }
        }
    </style>
</head>
<body>
    <main>
        <a class="back-link" href="index.html#gallery">العودة إلى معرض الصور</a>
        <article id="wisdom-card" hidden>
            <img id="scene-image" alt="">
            <div class="content">
                <h1 id="scene-title"></h1>
                <blockquote id="scene-wisdom"></blockquote>
                <section class="wisdom-details" aria-labelledby="details-title">
                    <h2 id="details-title">معنى الحكمة وفائدتها</h2>
                    <p id="scene-benefit"></p>
                </section>
                <nav class="entry-navigation" aria-label="التنقل بين الحكم">
                    <a id="previous-entry" hidden>← الحكمة السابقة</a>
                    <a id="next-entry" hidden>الحكمة التالية →</a>
                </nav>
            </div>
        </article>
        <p class="not-found" id="not-found" hidden>لم نعثر على حكمة لهذه الصورة. يمكنك العودة إلى معرض الصور واختيار صورة أخرى.</p>
    </main>

    <script>
        const makeScene = ({ skyTop, skyBottom, hill, accent, label }) => {
            const svg = `
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
                    <defs>
                        <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
                            <stop offset="0%" stop-color="${skyTop}"/>
                            <stop offset="100%" stop-color="${skyBottom}"/>
                        </linearGradient>
                    </defs>
                    <rect width="1200" height="900" fill="url(#sky)"/>
                    <circle cx="930" cy="180" r="100" fill="rgba(255,255,255,0.25)"/>
                    <path d="M0,620 C180,520 280,520 420,590 S720,740 1200,610 L1200,900 L0,900 Z" fill="${hill}" opacity="0.9"/>
                    <path d="M0,700 C200,630 380,640 510,700 S820,800 1200,680 L1200,900 L0,900 Z" fill="${accent}" opacity="0.72"/>
                    <path d="M0,760 L1200,760 L1200,900 L0,900 Z" fill="#1d3c3f" opacity="0.30"/>
                    <text x="600" y="540" text-anchor="middle" font-family="Tahoma, Arial, sans-serif" font-size="60" fill="white" font-weight="700" opacity="0.9">${label}</text>
                </svg>
            `;
            return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;
        };

        const wisdomEntries = [
            { image: makeScene({ skyTop: '#f4b183', skyBottom: '#f7dca0', hill: '#4a7a64', accent: '#7aa66d', label: 'غروب' }), alt: 'غروب الشمس بين الجبال وفوق مرج أخضر', title: 'غروب بين الجبال', wisdom: 'بعد كل غروب، يولد فجر جديد.', benefit: 'تذكّرنا هذه الحكمة أن النهايات ليست دائمًا خسارة؛ فقد تكون بداية لفرصة وتجربة جديدة. تمنحنا فرصة للتأمل في أن كل نهاية قد تُمهّد لبداية أكثر إشراقًا.' },
            { image: makeScene({ skyTop: '#99d0da', skyBottom: '#f3d0a8', hill: '#4d7282', accent: '#7dc3bf', label: 'بحيرة' }), alt: 'غروب الشمس فوق بحيرة هادئة', title: 'غروب على البحيرة', wisdom: 'في الهدوء نرى ما تخفيه الضوضاء.', benefit: 'حين نهدأ ونمنح أنفسنا وقتًا للتأمل، نستطيع فهم مشاعرنا والمواقف من حولنا بصورة أوضح. تساعدنا هذه الحكمة على التوقف والبحث عن الوضوح.' },
            { image: makeScene({ skyTop: '#ebad6d', skyBottom: '#fbe3b2', hill: '#4e8b66', accent: '#9ecb71', label: 'مرج' }), alt: 'غروب الشمس فوق مرج أخضر وضباب خفيف', title: 'غروب في مرج أخضر', wisdom: 'الجمال يزهر حيث يجد من يرعاه.', benefit: 'تذكّرنا بأن الأشياء الجميلة، مثل العلاقات والمهارات والأحلام، تحتاج إلى عناية واهتمام مستمر كي تنمو وتزدهر.' },
            { image: makeScene({ skyTop: '#e5896f', skyBottom: '#f9d4a8', hill: '#547d83', accent: '#ebaa79', label: 'سماء' }), alt: 'سماء برتقالية عند الغروب فوق الأشجار', title: 'ألوان السماء وقت الغروب', wisdom: 'لكل نهاية لونٌ يليق بها.', benefit: 'تدعونا إلى تقبّل تغيّر المراحل؛ فلكل تجربة أثرها ومعناها، ويمكننا أن نجد في الوداع ذكرى جميلة وتعليمة قيمة.' },
            { image: makeScene({ skyTop: '#9ed4d4', skyBottom: '#dff3d4', hill: '#285f54', accent: '#82bc7f', label: 'غابة' }), alt: 'أشعة الشمس تتسلل بين أشجار الغابة', title: 'غابة خضراء', wisdom: 'القوة تنمو بصبر، مثل الأشجار.', benefit: 'النمو الحقيقي يحتاج وقتًا وثباتًا. تساعدنا الحكمة على تقدير الخطوات الصغيرة وعدم استعجال النتائج.' },
            { image: makeScene({ skyTop: '#d9ebf5', skyBottom: '#f4efe4', hill: '#566d7a', accent: '#9baea2', label: 'قمم' }), alt: 'قمم جبلية شاهقة تحت غيوم بيضاء', title: 'قمم جبلية', wisdom: 'القمم العالية تبدأ بخطوة ثابتة.', benefit: 'الأهداف الكبيرة تصبح أقرب عندما نقسمها إلى خطوات عملية ونواصل التقدم بثبات، حتى لو كان ببطء.' },
            { image: makeScene({ skyTop: '#8ec6e4', skyBottom: '#dff4ff', hill: '#2f6d94', accent: '#7bb4d8', label: 'محيط' }), alt: 'أمواج المحيط الزرقاء عن قرب', title: 'أمواج المحيط', wisdom: 'المرونة قوة حين تعصف الأمواج.', benefit: 'المرونة تساعدنا على التكيّف مع التغيّرات من دون التخلي عن قيمنا، وعلى البحث عن حلول عند تعثر المسارات.' },
            { image: makeScene({ skyTop: '#f4b07d', skyBottom: '#f7dfb5', hill: '#d5b08b', accent: '#7bb6c6', label: 'شاطئ' }), alt: 'شاطئ رملي ومياه بحر في ضوء الغروب', title: 'شاطئ هادئ', wisdom: 'امنح نفسك وقتًا لتستعيد هدوءك.', benefit: 'الراحة والعناية بالنفس ليستا ترفًا؛ فالتوقف قليلًا يساعد على استعادة الطاقة والتركيز ومواصلة الطريق بسلام.' },
            { image: makeScene({ skyTop: '#79c7d2', skyBottom: '#d7f0f3', hill: '#3a5c50', accent: '#7cb7a9', label: 'شلال' }), alt: 'شلال ينساب بين الصخور والأشجار', title: 'شلال بين الصخور', wisdom: 'الاستمرار يصنع طريقًا حتى في الصخر.', benefit: 'الجهد المتواصل قد يحقق ما يبدو صعبًا في البداية. تذكّرنا الحكمة بالمثابرة مع التحلي بالصبر والمرونة.' },
            { image: makeScene({ skyTop: '#d9c08a', skyBottom: '#f3e1b2', hill: '#b8864e', accent: '#d7b57a', label: 'صحراء' }), alt: 'تكوينات صخرية في صحراء واسعة', title: 'صخور الصحراء', wisdom: 'في أبسط الأماكن يتجلى أعمق الجمال.', benefit: 'تساعدنا على ملاحظة التفاصيل الصغيرة وتقدير ما حولنا، بدل انتظار الظروف المثالية كي نشعر بالفرح.' },
            { image: makeScene({ skyTop: '#c8d8be', skyBottom: '#ecf1db', hill: '#496a44', accent: '#719a66', label: 'حياة' }), alt: 'حيوان بري بين الجبال والأشجار', title: 'حياة برية', wisdom: 'احترام الحياة يبدأ بتركها تعيش بطبيعتها.', benefit: 'تذكّرنا بأهمية الرفق بالكائنات والمحافظة على بيئاتها، وأن مسؤوليتنا تجاه الطبيعة تبدأ من الاحترام.' },
            { image: makeScene({ skyTop: '#a3d9f3', skyBottom: '#f9f3cc', hill: '#79a25f', accent: '#f1d35a', label: 'أزهار' }), alt: 'أزهار برية صفراء تحت سماء زرقاء', title: 'أزهار برية', wisdom: 'ازهر في مكانك، ولو كنت وحدك.', benefit: 'لا يلزم أن ننتظر تصفيق الآخرين لننمو. ركّز على ما تستطيع تطويره في نفسك، وامنح إنجازاتك الصغيرة مساحة للظهور.' },
            { image: makeScene({ skyTop: '#d8ebf0', skyBottom: '#f6f4ef', hill: '#516a6d', accent: '#a0b9b0', label: 'ضباب' }), alt: 'ضباب يحيط بجبال خضراء وقت الشروق', title: 'جبال يكسوها الضباب', wisdom: 'ليس كل ما غاب عن العين قد ضاع.', benefit: 'قد تحجب الظروف الرؤية مؤقتًا، لكن ذلك لا يعني أن الطريق انتهى. تمنحنا الحكمة مساحة للصبر حتى يزول الضباب.' },
            { image: makeScene({ skyTop: '#7ec2d2', skyBottom: '#eaf7ff', hill: '#527b6e', accent: '#9bd0d0', label: 'بحيرة' }), alt: 'بحيرة جبلية صافية تحيط بها الجبال', title: 'بحيرة جبلية', wisdom: 'صفاء القلب يعكس جمال العالم.', benefit: 'حين نخفف من التوتر والأحكام المسبقة، نصبح أقدر على رؤية الجوانب الجميلة في الناس والأماكن.' },
            { image: makeScene({ skyTop: '#88d5d0', skyBottom: '#dff7f2', hill: '#3c7a6c', accent: '#6ba986', label: 'نهر' }), alt: 'نهر صافٍ يجري بين الصخور والغابة', title: 'نهر وسط الغابة', wisdom: 'امضِ بهدوء، فلكل طريق مجراه.', benefit: 'المقارنة بالآخرين قد تشتتنا؛ فلكل شخص ظروفه وإيقاعه. ركّز على مسارك واتخذ الخطوة المناسبة لك.' },
            { image: makeScene({ skyTop: '#cfe8f7', skyBottom: '#eef8ff', hill: '#6987a3', accent: '#cfdbef', label: 'ثلج' }), alt: 'جبال ووديان تغطيها الثلوج', title: 'مناظر شتوية', wisdom: 'وراء البرد سكون يهيئ للحياة.', benefit: 'بعض فترات الهدوء تبدو بطيئة، لكنها تمنحنا فرصة للراحة والاستعداد. ليس كل توقف تعطّلًا؛ فقد يكون تحضيرًا لنمو جديد.' },
            { image: makeScene({ skyTop: '#dca873', skyBottom: '#f8d7a7', hill: '#75654e', accent: '#d3835b', label: 'خريف' }), alt: 'أشجار خريفية ملونة تنعكس على سطح الماء', title: 'ألوان الخريف', wisdom: 'التغيير قد يكون أجمل فصول الحياة.', benefit: 'تساعدنا على استقبال التغيير بفضول بدل الخوف، ورؤية ما يمكن أن يفتحه من فرص وتجارب جديدة.' },
            { image: makeScene({ skyTop: '#adc9c4', skyBottom: '#f0f2d7', hill: '#4d7c64', accent: '#91a879', label: 'وادي' }), alt: 'وادي أخضر بين تلال جبلية', title: 'وادي جبلي', wisdom: 'بين القمم متسعٌ للطريق والأمل.', benefit: 'حتى عندما تبدو العقبات عالية، قد توجد طرق ومساحات لم نلاحظها بعد. التشاور والتأني يساعدان على المضي قدمًا.' },
            { image: makeScene({ skyTop: '#f1d09e', skyBottom: '#f7e7b5', hill: '#b07d4a', accent: '#d3b976', label: 'صبار' }), alt: 'نبات صبار بأشواك دقيقة', title: 'نباتات صحراوية', wisdom: 'الصبر يزهر حتى في أقسى الظروف.', benefit: 'تذكّرنا بأن القدرة على التكيّف والصمود قد تساعدنا على بناء حياة طيبة رغم التحديات، مع الحرص على التوازن.' },
            { image: makeScene({ skyTop: '#d0d9e8', skyBottom: '#f7f6f1', hill: '#5e6c7a', accent: '#a7b1bf', label: 'أفق' }), alt: 'طبقات من الجبال تتدرج في الأفق', title: 'جبال متدرجة', wisdom: 'كل ��فق جديد يكشف طريقًا آخر.', benefit: 'كلما اكتسبنا خبرة واتسعت رؤيتنا، ظهرت أمامنا خيارات جديدة. التعلم المستمر يساعدنا على مواصلة التقدم.' }
        ];

        const imageParameter = new URLSearchParams(window.location.search).get('image');
        const imageIndex = imageParameter !== null && /^\d+$/.test(imageParameter) ? Number(imageParameter) : -1;
        const entry = wisdomEntries[imageIndex];

        if (entry) {
            document.title = `نبذة عن الحكمة: ${entry.title}`;
            document.getElementById('scene-image').src = entry.image;
            document.getElementById('scene-image').alt = entry.alt;
            document.getElementById('scene-title').textContent = entry.title;
            document.getElementById('scene-wisdom').textContent = `❝ ${entry.wisdom} ❞`;
            document.getElementById('scene-benefit').textContent = entry.benefit;

            const previousLink = document.getElementById('previous-entry');
            const nextLink = document.getElementById('next-entry');
            if (imageIndex > 0) {
                previousLink.href = `wisdom.html?image=${imageIndex - 1}`;
                previousLink.hidden = false;
            }
            if (imageIndex < wisdomEntries.length - 1) {
                nextLink.href = `wisdom.html?image=${imageIndex + 1}`;
                nextLink.hidden = false;
            }

            document.getElementById('wisdom-card').hidden = false;
        } else {
            document.getElementById('not-found').hidden = false;
        }
    </script>
</body>
</html>
