<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f2f5f1">
    <title>نبذة عن الحكمة</title>
    <style>
        :root {
            --bg: #f2f5f1;
            --panel: #ffffff;
            --ink: #183b3b;
            --muted: #345858;
            --line: #dce7e1;
            --gold: #efb172;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 32px 24px 48px;
            color: var(--ink);
            background: var(--bg);
            font-family: Tahoma, Arial, sans-serif;
        }

        main {
            width: min(100%, 760px);
            margin: 0 auto;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--ink);
            font-size: 16px;
            font-weight: 700;
            text-decoration-thickness: 2px;
            text-underline-offset: 4px;
        }

        article {
            overflow: hidden;
            border-radius: 18px;
            background: var(--panel);
            box-shadow: 0 12px 28px rgba(24,59,59,0.12);
        }

        article img {
            display: block;
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            background: #d9e2dc;
        }

        .content { padding: 26px 24px 24px; }

        .wisdom-details {
            padding: 20px 22px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: #f7faf7;
        }

        h1 {
            margin: 0 0 18px;
            font-size: clamp(26px, 5vw, 38px);
            line-height: 1.5;
        }

        blockquote {
            margin: 0 0 20px;
            padding: 18px 22px;
            border-inline-start: 5px solid var(--gold);
            border-radius: 12px;
            color: #fff;
            background: linear-gradient(180deg, #183b3b 0%, #213f40 100%);
            font-family: "Noto Naskh Arabic", Amiri, "Traditional Arabic", serif;
            font-size: clamp(22px, 4vw, 31px);
            font-weight: 600;
            line-height: 1.9;
            text-align: center;
        }

        .wisdom-details h2 {
            display: flex;
            align-items: center;
            gap: 9px;
            margin: 0 0 12px;
            color: var(--ink);
            font-size: 23px;
            line-height: 1.5;
        }

        .wisdom-details h2::before {
            color: #b85d3b;
            content: "✦";
            font-size: 20px;
        }

        .wisdom-details p {
            margin: 0;
            color: var(--muted);
            font-size: 20px;
            font-weight: 500;
            line-height: 2;
        }

        .entry-navigation {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 22px;
        }

        .entry-navigation a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 46px;
            padding: 10px 16px;
            border: 1px solid var(--ink);
            border-radius: 10px;
            color: var(--ink);
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
        }

        .entry-navigation a:hover,
        .entry-navigation a:focus-visible {
            color: #fff;
            background: var(--ink);
        }

        .entry-navigation a[hidden] { display: none; }

        .not-found {
            padding: 24px;
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 8px 20px rgba(24,59,59,0.06);
            font-size: 18px;
            line-height: 1.8;
        }

        @media (max-width: 640px) {
            body { padding: 20px 18px 36px; }
            .content { padding: 20px; }
        }
    </style>
</head>
<body>
    <main>
        <a class="back-link" href="index.html#gallery">العودة إلى معرض الصور</a>
        <article id="wisdom-card" hidden>
            <img id="scene-image" alt="">
            <div class="content">
                <h1 id="scene-title"></h1>
                <blockquote id="scene-wisdom"></blockquote>
                <section class="wisdom-details" aria-labelledby="details-title">
                    <h2 id="details-title">معنى الحكمة وفائدتها</h2>
                    <p id="scene-benefit"></p>
                </section>
                <nav class="entry-navigation" aria-label="التنقل بين الحكم">
                    <a id="previous-entry" hidden>← الحكمة السابقة</a>
                    <a id="next-entry" hidden>الحكمة التالية →</a>
                </nav>
            </div>
        </article>
        <p class="not-found" id="not-found" hidden>لم نعثر على حكمة لهذه الصورة. يمكنك العودة إلى معرض الصور واختيار صورة أخرى.</p>
    </main>

    <script>
        const wisdomEntries = [
            { icon: '🌄', image: 'https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1200&q=80', alt: 'غروب الشمس بين الجبال فوق مرج أخضر', title: 'غروب بين الجبال', wisdom: 'بعد كل غروب، يولد فجر جديد.', benefit: 'تذكّرنا هذه الحكمة أن النهايات قد تكون مقدمة لبداية جديدة، وأن ما يبدو كخسارة في بعض اللحظات قد يكون بابًا للفرص والرحمة.' },
            { icon: '🌅', image: 'https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1200&q=80', alt: 'غروب فوق بحيرة هادئة', title: 'غروب على البحيرة', wisdom: 'في الهدوء نرى ما تخفيه الضوضاء.', benefit: 'تعلّمنا هذه الحكمة أن التوقف يسمح لنا بتمييز الحقيقة والوضوح، وأن الهدوء أحيانًا هو الطريق إلى الفهم الصحيح للقضايا والناس.' },
            { icon: '🌾', image: 'https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1200&q=80', alt: 'مرج أخضر وضباب خفيف عند الغروب', title: 'مرج أخضر في المساء', wisdom: 'الجمال يزهر حيث يجد من يرعاه.', benefit: 'تذكّرنا بأن النعم والفرص تحتاج إلى عناية، وأن الجمال الحقيقي لا ينمو من تلقاء نفسه، بل يزهر عندما يلتفت الإنسان إليه ويرعاه.' },
            { icon: '🌤️', image: 'https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1200&q=80', alt: 'سماء برتقالية فوق الأشجار', title: 'ألوان السماء', wisdom: 'لكل نهاية لونٌ يليق بها.', benefit: 'تُرينا الحكمة أن كل مرحلة من الحياة لها طابعها الخاص، وأن التغيير لا يُعدّ نهاية محطمة بل جزءًا من نسيج الحياة المتجدد.' },
            { icon: '🌲', image: 'https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1200&q=80', alt: 'أشعة الشمس تتسلل بين أغصان الغابة', title: 'غابة خضراء', wisdom: 'القوة تنمو بصبر، مثل الأشجار.', benefit: 'تعلّمنا أن النمو الحقيقي يحتاج وقتًا، ومثابرة، وشجاعةً للتقدم ببطء مع الحفاظ على الاستقرار، حتى يصل النضج.' },
            { icon: '🏔️', image: 'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1200&q=80', alt: 'قمم جبلية شاهقة تحت سحب بيضاء', title: 'قمم جبلية', wisdom: 'القمم العالية تبدأ بخطوة ثابتة.', benefit: 'تذكّرنا أن التحديات الكبيرة لا تُقهر دفعة واحدة، بل تُغلب بخطوات متتابعة وصبر، فكل خطوة صغيرة تقتربنا من الهدف.' },
            { icon: '🌊', image: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1200&q=80', alt: 'أمواج زرقاء تتدحرج نحو الشاطئ', title: 'أمواج المحيط', wisdom: 'المرونة قوة حين تعصف الأمواج.', benefit: 'تعلّمنا أن القوة ليست في عدم السقوط، بل في القدرة على التكيّف والعودة إلى المسار الصحيح بعد كل اضطراب.' },
            { icon: '🏖️', image: 'https://images.unsplash.com/photo-1500375592092-40eb2168fd21?auto=format&fit=crop&w=1200&q=80', alt: 'شاطئ رملي ومياه هادئة في ضوء المساء', title: 'شاطئ هادئ', wisdom: 'امنح نفسك وقتًا لتستعيد هدوءك.', benefit: 'تذكرنا هذه الحكمة بأن الراحة ليست ترفًا، بل ضرورة لإعادة التوازن، وضبط النفس، واستعادة الطاقة لمواصلة الطريق بسلاسة.' },
            { icon: '💧', image: 'https://images.unsplash.com/photo-1506748686214-e9df14d4d9d0?auto=format&fit=crop&w=1200&q=80', alt: 'ماء ينساب بين الصخور والأشجار', title: 'شلال بين الصخور', wisdom: 'الاستمرار يصنع طريقًا حتى في الصخر.', benefit: 'تُرينا الحكمة أن المثابرة وجودة العزيمة تستطيعان فتح المسارات حتى في الأماكن التي تبدو صعبة أو موحشة.' },
            { icon: '🏜️', image: 'https://images.unsplash.com/photo-1473448912268-2022ce9509d8?auto=format&fit=crop&w=1200&q=80', alt: 'تكوينات صخرية واسعة في صحراء مفتوحة', title: 'صخور الصحراء', wisdom: 'في أبسط الأماكن يتجلى أعمق الجمال.', benefit: 'تعلّمنا أن الجمال لا يحتاج إلى تعقيد، وإنما إلى عين متفتحة، لأن التفاصيل الصغيرة في الحياة أحيانًا تحمل أعظم المعاني.' },
            { icon: '🦌', image: 'https://images.unsplash.com/photo-1474511320723-9a56873867b5?auto=format&fit=crop&w=1200&q=80', alt: 'حيوان بري بين الجبال والأشجار', title: 'حياة برية', wisdom: 'احترام الحياة يبدأ بتركها تعيش بطبيعتها.', benefit: 'تذكّرنا بأهمية الرفق بالحياة والبيئة، وأن العناية بالطبيعة تأتي من الاحترام، لا من السيطرة أو القسوة.' },
            { icon: '🌼', image: 'https://images.unsplash.com/photo-1466692476868-aef1dfb1e735?auto=format&fit=crop&w=1200&q=80', alt: 'أزهار صفراء تحت سماء زرقاء', title: 'أزهار برية', wisdom: 'ازهر في مكانك، ولو كنت وحدك.', benefit: 'تُعلّمنا أن النمو لا يحتاج إلى إشادة خارجية، بل أن كل إنسان قادر على الازدهار عندما يزرع مهاراته ويتعهد قدراته.' },
            { icon: '☁️', image: 'https://images.unsplash.com/photo-1501854140801-50d01698950b?auto=format&fit=crop&w=1200&q=80', alt: 'جبال خضراء محاطة بالضباب عند الشروق', title: 'جبال يكسوها الضباب', wisdom: 'ليس كل ما غاب عن العين قد ضاع.', benefit: 'تُذكرنا أن الغيابات والضبابات المؤقتة لا تعني أن الطريق قد انتهى، بل غالبًا تُعني أن الطريق ما ��ال يتشكل ببطء.' },
            { icon: '🛶', image: 'https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1200&q=80', alt: 'بحيرة صافية تحيط بها الجبال', title: 'بحيرة جبلية', wisdom: 'صفاء القلب يعكس جمال العالم.', benefit: 'تعلّمنا أن الصفاء الداخلي يساعد على رؤية الجمال في الناس والأماكن، وأن الهدوء النفسي يفتح باب الفهم والتقدير.' },
            { icon: '🌿', image: 'https://images.unsplash.com/photo-1482192505345-5655af888cc4?auto=format&fit=crop&w=1200&q=80', alt: 'نهر يجري بين الصخور والغابة', title: 'نهر وسط الغابة', wisdom: 'امضِ بهدوء، فلكل طريق مجراه.', benefit: 'تذكّرنا أن كل فرد له سرعته الخاصة، وأن المقارنة بالغير قد تشتت الرحلة، لذا الأفضل أن نلتزم بمسارنا الخاص.' },
            { icon: '❄️', image: 'https://images.unsplash.com/photo-1511497584788-876760111969?auto=format&fit=crop&w=1200&q=80', alt: 'جبال ووديان مغطاة بالثلوج', title: 'مناظر شتوية', wisdom: 'وراء ا��برد سكون يهيئ للحياة.', benefit: 'تعلّمنا أن فترات الهدوء والراحة ليست فراغًا، بل وقتًا معدًّا للنمو واستعادة القوة والقدرة على التجدد.' },
            { icon: '🍂', image: 'https://images.unsplash.com/photo-1473448912268-2022ce9509d8?auto=format&fit=crop&w=1200&q=80', alt: 'أشجار خريفية ملونة تعكسها المياه', title: 'ألوان الخريف', wisdom: 'التغيير قد يكون أجمل فصول الحياة.', benefit: 'تذكّرنا أن التغيرات، رغم أحيانًا صعوبتها، قد تحمل فرصًا جديدة وروايات جميلة لا نُدركها إلا بعد مرورها.' },
            { icon: '⛰️', image: 'https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1200&q=80', alt: 'وادي أخضر بين تلال جبلية', title: 'وادي جبلي', wisdom: 'بين القمم متسعٌ للطريق والأمل.', benefit: 'تُرينا أنه حتى في أحلك الظروف أو المرتفعات العالية، توجد طرق جديدة وقمم جديدة تُفْتَح مع الصبر والمرونة.' },
            { icon: '🌵', image: 'https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1200&q=80', alt: 'نباتات صبار بأشواك دقيقة', title: 'نباتات صحراوية', wisdom: 'الصبر يزهر حتى في أقسى الظروف.', benefit: 'تذكّرنا أن القوة الحقيقية ليست في عدم وجود التحديات، بل في القدرة على التكيف والبقاء والازدهار رغم القسوة.' },
            { icon: '🌄', image: 'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1200&q=80', alt: 'طبقات جبلية تتدرج في الأفق', title: 'جبال متدرجة', wisdom: 'كل أفق جديد يكشف طريقًا آخر.', benefit: 'تعلّمنا أن الخبرة والرؤية الجديدة تفتح أمامنا أبوابًا متجددة، وكل خطوة تعلم تضعنا على أفق أكثر وضوحًا.' }
        ];

        const imageParameter = new URLSearchParams(window.location.search).get('image');
        const imageIndex = imageParameter !== null && /^\d+$/.test(imageParameter) ? Number(imageParameter) : -1;
        const entry = wisdomEntries[imageIndex];

        if (entry) {
            document.title = `نبذة عن الحكمة: ${entry.title}`;
            document.getElementById('scene-image').src = entry.image;
            document.getElementById('scene-image').alt = entry.alt;
            document.getElementById('scene-title').textContent = `${entry.icon} ${entry.title}`;
            document.getElementById('scene-wisdom').textContent = `❝ ${entry.wisdom} ❞`;
            document.getElementById('scene-benefit').textContent = entry.benefit;

            const previousLink = document.getElementById('previous-entry');
            const nextLink = document.getElementById('next-entry');
            if (imageIndex > 0) {
                previousLink.href = `wisdom.html?image=${imageIndex - 1}`;
                previousLink.hidden = false;
            }
            if (imageIndex < wisdomEntries.length - 1) {
                nextLink.href = `wisdom.html?image=${imageIndex + 1}`;
                nextLink.hidden = false;
            }

            document.getElementById('wisdom-card').hidden = false;
        } else {
            document.getElementById('not-found').hidden = false;
        }
    </script>
</body>
</html>
