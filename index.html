<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f2f5f1">
    <title>مرحباً</title>
    <style>
        :root {
            --bg: #f2f5f1;
            --panel: #ffffff;
            --ink: #183b3b;
            --muted: #345858;
            --gold: #efb172;
            --green: #7fd04c;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 0 24px 60px;
            color: var(--ink);
            background: var(--bg);
            font-family: Tahoma, Arial, sans-serif;
        }

        .ticker {
            width: 100vw;
            min-height: 58px;
            margin: 0 calc(50% - 50vw);
            background: rgba(255,255,255,0.38);
            border-bottom: 1px solid rgba(24,59,59,0.08);
        }

        .ticker-track {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 58px;
        }

        .ticker-group {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-around;
            gap: 4px 12px;
            width: 100%;
            min-height: 58px;
            padding: 8px 16px;
            direction: rtl;
            white-space: nowrap;
            font-size: clamp(18px, 2.4vw, 24px);
            font-weight: 700;
        }

        .ticker-group span::after {
            margin-inline-start: 8px;
            color: var(--green);
            content: "✦";
        }

        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            overflow: hidden;
            clip: rect(0,0,0,0);
            white-space: nowrap;
            border: 0;
        }

        main {
            width: min(100%, 1080px);
            margin: 0 auto;
        }

        header {
            padding: 42px 0 20px;
            text-align: center;
        }

        .eyebrow {
            margin: 0 0 14px;
            color: #d78d47;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(52px, 9vw, 92px);
            line-height: 1.08;
            letter-spacing: -0.04em;
        }

        .subtitle {
            margin: 18px auto 0;
            max-width: 640px;
            color: var(--muted);
            font-size: clamp(17px, 2.2vw, 22px);
            line-height: 1.9;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 26px;
            margin-top: 24px;
        }

        figure {
            display: flex;
            flex-direction: column;
            min-width: 0;
            margin: 0;
            overflow: hidden;
            border: 1px solid rgba(24,59,59,0.08);
            border-radius: 18px;
            background: var(--panel);
            box-shadow: 0 10px 24px rgba(24,59,59,0.07);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        figure:hover {
            transform: translateY(-3px);
            box-shadow: 0 16px 30px rgba(24,59,59,0.12);
        }

        figure img {
            display: block;
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            background: #d9e2dc;
        }

        figcaption {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 18px 18px 20px;
            color: #fff;
            background: linear-gradient(180deg, #183b3b 0%, #204445 100%);
            font-size: 20px;
            font-weight: 700;
        }

        .caption-header {
            display: flex;
            align-items: center;
            gap: 10px;
            line-height: 1.5;
        }

        .caption-icon {
            font-size: 24px;
            line-height: 1;
        }

        .wisdom-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: fit-content;
            padding: 7px 12px;
            border: 1px solid rgba(239,177,114,0.9);
            border-radius: 999px;
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .wisdom-link:hover,
        .wisdom-link:focus-visible {
            color: var(--ink);
            background: var(--gold);
        }

        .wisdom {
            display: block;
            color: #d7e5df;
            font-family: "Noto Naskh Arabic", Amiri, "Traditional Arabic", serif;
            font-size: clamp(20px, 2vw, 24px);
            font-weight: 600;
            line-height: 1.9;
            text-align: center;
        }

        .wisdom::before {
            margin-inline-end: 6px;
            color: var(--gold);
            content: "❝";
            font-family: Georgia, serif;
            font-size: 20px;
            vertical-align: -2px;
        }

        @media (max-width: 640px) {
            body { padding: 0 18px 40px; }
            .ticker { min-height: 52px; }
            .ticker-group { font-size: 18px; }
            .ticker-group span::after { margin-inline-start: 4px; }
            .gallery { grid-template-columns: 1fr; gap: 24px; }
            header { padding-top: 28px; }
        }
    </style>
</head>
<body>
    <div class="ticker">
        <span class="visually-hidden">الحمد لله، الشكر لله، سبحان الله وبحمده، سبحان الله العظيم</span>
        <div class="ticker-track" aria-hidden="true">
            <div class="ticker-group">
                <span>الحمد لله</span>
                <span>الشكر لله</span>
                <span>سبحان الله وبحمده</span>
                <span>سبحان الله العظيم</span>
            </div>
        </div>
    </div>

    <main>
        <header>
            <p class="eyebrow">Gallery</p>
            <h1>مرحباً</h1>
            <p class="subtitle">معرضٌ لطبيعة هادئة، وأفكارٌ تعيد التوازن إلى النفس، وتذكّرنا بأن كل لحظة تحمل في طياتها نورًا جديدًا.</p>
        </header>

        <section class="gallery" id="gallery" aria-label="معرض صور الطبيعة"></section>
    </main>

    <script>
        const galleryItems = [
            { title: 'غروب بين الجبال', icon: '🌄', caption: 'غروب الشمس بين الجبال فوق مرج أخضر', wisdom: 'بعد كل غروب، يولد فجر جديد.', image: 'https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1200&q=80' },
            { title: 'غروب على البحيرة', icon: '🌅', caption: 'غروب شاحب فوق مياه هادئة', wisdom: 'في الهدوء نرى ما تخفيه الضوضاء.', image: 'https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1200&q=80' },
            { title: 'مرج أخضر في المساء', icon: '🌾', caption: 'مرج أخضر وضباب خفيف عند الغروب', wisdom: 'الجمال يزهر حيث يجد من يرعاه.', image: 'https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1200&q=80' },
            { title: 'ألوان السماء', icon: '🌤️', caption: 'سماء برتقالية فوق الأشجار', wisdom: 'لكل نهاية لونٌ يليق بها.', image: 'https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1200&q=80' },
            { title: 'غابة خضراء', icon: '🌲', caption: 'أشعة الشمس تتسلل بين أغصان الغابة', wisdom: 'القوة تنمو بصبر، مثل الأشجار.', image: 'https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1200&q=80' },
            { title: 'قمم جبلية', icon: '🏔️', caption: 'قمم شاهقة تحت سحب بيضاء', wisdom: 'القمم العالية تبدأ بخطوة ثابتة.', image: 'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1200&q=80' },
            { title: 'أمواج المحيط', icon: '🌊', caption: 'أمواج زرقاء تتدحرج نحو الشاطئ', wisdom: 'المرونة قوة حين تعصف الأمواج.', image: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1200&q=80' },
            { title: 'شاطئ هادئ', icon: '🏖️', caption: 'شاطئ رملي مع ماء هادئ في ضوء المساء', wisdom: 'امنح نفسك وقتًا لتستعيد هدوءك.', image: 'https://images.unsplash.com/photo-1500375592092-40eb2168fd21?auto=format&fit=crop&w=1200&q=80' },
            { title: 'شلال بين الصخور', icon: '💧', caption: 'ماء ينساب بين الصخور والأشجار', wisdom: 'الاستمرار يصنع طريقًا حتى في الصخر.', image: 'https://images.unsplash.com/photo-1506748686214-e9df14d4d9d0?auto=format&fit=crop&w=1200&q=80' },
            { title: 'صخور الصحراء', icon: '🏜️', caption: 'تكوينات صخرية واسعة في صحراء مفتوحة', wisdom: 'في أبسط الأماكن يتجلى أعمق الجمال.', image: 'https://images.unsplash.com/photo-1473448912268-2022ce9509d8?auto=format&fit=crop&w=1200&q=80' },
            { title: 'حياة برية', icon: '🦌', caption: 'حيوان بري بين الجبال والأشجار', wisdom: 'احترام الحياة يبدأ بتركها تعيش بطبيعتها.', image: 'https://images.unsplash.com/photo-1474511320723-9a56873867b5?auto=format&fit=crop&w=1200&q=80' },
            { title: 'أزهار برية', icon: '🌼', caption: 'أزهار صفراء تحت سماء زرقاء', wisdom: 'ازهر في مكانك، ولو كنت وحدك.', image: 'https://images.unsplash.com/photo-1466692476868-aef1dfb1e735?auto=format&fit=crop&w=1200&q=80' },
            { title: 'جبال يكسوها الضباب', icon: '☁️', caption: 'جبال خضراء محاطة بالضباب عند الشروق', wisdom: 'ليس كل ما غاب عن العين قد ضاع.', image: 'https://images.unsplash.com/photo-1501854140801-50d01698950b?auto=format&fit=crop&w=1200&q=80' },
            { title: 'بحيرة جبلية', icon: '🛶', caption: 'بحيرة صافية تحيط بها الجبال', wisdom: 'صفاء القلب يعكس جمال العالم.', image: 'https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1200&q=80' },
            { title: 'نهر وسط الغابة', icon: '🌿', caption: 'نهر يجري بين الصخور والغابة', wisdom: 'امضِ بهدوء، فلكل طريق مجراه.', image: 'https://images.unsplash.com/photo-1482192505345-5655af888cc4?auto=format&fit=crop&w=1200&q=80' },
            { title: 'مناظر شتوية', icon: '❄️', caption: 'جبال ووديان مغطاة بالثلوج', wisdom: 'وراء البرد سكون يهيئ للحياة.', image: 'https://images.unsplash.com/photo-1511497584788-876760111969?auto=format&fit=crop&w=1200&q=80' },
            { title: 'ألوان الخريف', icon: '🍂', caption: 'أشجار خريفية ملونة تعكسها المياه', wisdom: 'التغيير قد يكون أجمل فصول الحياة.', image: 'https://images.unsplash.com/photo-1473448912268-2022ce9509d8?auto=format&fit=crop&w=1200&q=80' },
            { title: 'وادي جبلي', icon: '⛰️', caption: 'وادي أخضر بين تلال جبلية', wisdom: 'بين القمم متسعٌ للطريق والأمل.', image: 'https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1200&q=80' },
            { title: 'نباتات صحراوية', icon: '🌵', caption: 'نباتات صبار بأشواك دقيقة', wisdom: 'الصبر يزهر حتى في أقسى الظروف.', image: 'https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1200&q=80' },
            { title: 'جبال متدرجة', icon: '🌄', caption: 'طبقات جبلية تتدرج في الأفق', wisdom: 'كل أفق جديد يكشف طريقًا آخر.', image: 'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1200&q=80' }
        ];

        const gallery = document.getElementById('gallery');

        galleryItems.forEach((item, index) => {
            const figure = document.createElement('figure');
            const img = document.createElement('img');
            const figcaption = document.createElement('figcaption');
            const captionHeader = document.createElement('div');
            const icon = document.createElement('span');
            const title = document.createElement('span');
            const link = document.createElement('a');
            const wisdom = document.createElement('span');

            img.src = item.image;
            img.alt = item.caption;
            img.loading = 'lazy';
            img.decoding = 'async';

            captionHeader.className = 'caption-header';
            icon.className = 'caption-icon';
            icon.textContent = item.icon;
            icon.setAttribute('aria-hidden', 'true');

            title.textContent = item.title;
            title.setAttribute('aria-label', item.title);

            link.className = 'wisdom-link';
            link.href = `wisdom.html?image=${index}`;
            link.textContent = 'اقرأ الحكمة';
            link.setAttribute('aria-label', `اقرأ نبذة عن حكمة ${item.title}`);

            wisdom.className = 'wisdom';
            wisdom.textContent = item.wisdom;

            captionHeader.appendChild(icon);
            captionHeader.appendChild(title);

            figcaption.appendChild(captionHeader);
            figcaption.appendChild(link);
            figcaption.appendChild(wisdom);

            figure.appendChild(img);
            figure.appendChild(figcaption);
            gallery.appendChild(figure);
        });
    </script>
</body>
</html>
