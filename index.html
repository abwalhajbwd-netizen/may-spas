<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f2f5f1">
    <title>مرحباً</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0 24px 48px;
            min-height: 100vh;
            color: #183b3b;
            background: #f2f5f1;
            font-family: Tahoma, Arial, sans-serif;
        }

        .ticker {
            display: block;
            width: 100vw;
            min-height: 58px;
            margin: 0 calc(50% - 50vw);
            color: #183b3b;
            background: transparent;
        }

        .ticker-track {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 58px;
        }

        .ticker-group {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-around;
            gap: 4px 12px;
            width: 100%;
            min-height: 58px;
            padding: 8px 16px;
            direction: rtl;
            white-space: nowrap;
            font-size: clamp(18px, 2.4vw, 24px);
            font-weight: 700;
        }

        .ticker-group span::after {
            margin-inline-start: 8px;
            color: #7fd04c;
            content: "✦";
        }

        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        main {
            width: min(100%, 1000px);
            margin: 0 auto;
        }

        header {
            margin-bottom: 38px;
            text-align: center;
        }

        h1 {
            margin: 0;
            font-size: clamp(58px, 10vw, 92px);
            line-height: 1.2;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 22px;
        }

        figure {
            display: flex;
            flex-direction: column;
            min-width: 0;
            margin: 0;
        }

        figure img {
            display: block;
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            object-position: center center;
            background: #d9e2dc;
            border-radius: 10px 10px 0 0;
        }

        figcaption {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 0;
            padding: 14px 18px 18px;
            border-radius: 0 0 8px 8px;
            color: #fff;
            background: #183b3b;
            font-size: 20px;
            font-weight: 700;
        }

        .caption-header {
            display: flex;
            align-items: center;
            gap: 10px;
            line-height: 1.5;
        }

        .caption-icon {
            font-size: 24px;
            line-height: 1;
        }

        .wisdom-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: fit-content;
            gap: 5px;
            padding: 5px 10px;
            border: 1px solid #efb172;
            border-radius: 999px;
            color: #fff;
            font-size: 13px;
            font-weight: 400;
            text-decoration: none;
        }

        .wisdom-link:hover,
        .wisdom-link:focus-visible {
            color: #183b3b;
            background: #efb172;
        }

        .wisdom {
            display: block;
            color: #d7e5df;
            font-family: "Noto Naskh Arabic", Amiri, "Traditional Arabic", serif;
            font-size: 22px;
            font-weight: 600;
            line-height: 1.9;
            text-align: center;
        }

        .wisdom::before {
            margin-inline-end: 6px;
            color: #efb172;
            content: "❝";
            font-family: Georgia, serif;
            font-size: 20px;
            vertical-align: -2px;
        }

        @media (max-width: 640px) {
            body { padding: 0 18px 36px; }
            .ticker { min-height: 52px; }
            .ticker-group { font-size: 18px; }
            .ticker-group span::after { margin-inline-start: 4px; }
            header { margin-bottom: 28px; }
            .gallery { grid-template-columns: 1fr; gap: 24px; }
        }
    </style>
</head>
<body>
    <div class="ticker">
        <span class="visually-hidden">الحمد لله، الشكر لله، سبحان الله وبحمده، سبحان الله العظيم</span>
        <div class="ticker-track" aria-hidden="true">
            <div class="ticker-group">
                <span>الحمد لله</span>
                <span>الشكر لله</span>
                <span>سبحان الله وبحمده</span>
                <span>سبحان الله العظيم</span>
            </div>
        </div>
    </div>

    <main>
        <header>
            <h1>مرحباً</h1>
        </header>
        <section class="gallery" id="gallery" aria-label="معرض صور الطبيعة"></section>
    </main>

    <script>
        const makeScene = ({ skyTop, skyBottom, hill, accent, label }) => {
            const svg = `
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
                    <defs>
                        <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
                            <stop offset="0%" stop-color="${skyTop}"/>
                            <stop offset="100%" stop-color="${skyBottom}"/>
                        </linearGradient>
                    </defs>
                    <rect width="1200" height="900" fill="url(#sky)"/>
                    <circle cx="930" cy="180" r="100" fill="rgba(255,255,255,0.25)"/>
                    <path d="M0,620 C180,520 280,520 420,590 S720,740 1200,610 L1200,900 L0,900 Z" fill="${hill}" opacity="0.9"/>
                    <path d="M0,700 C200,630 380,640 510,700 S820,800 1200,680 L1200,900 L0,900 Z" fill="${accent}" opacity="0.72"/>
                    <path d="M0,760 L1200,760 L1200,900 L0,900 Z" fill="#1d3c3f" opacity="0.30"/>
                    <text x="600" y="540" text-anchor="middle" font-family="Tahoma, Arial, sans-serif" font-size="60" fill="white" font-weight="700" opacity="0.9">${label}</text>
                </svg>
            `;
            return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;
        };

        const galleryItems = [
            { title: 'غروب بين الجبال', icon: '🌄', caption: 'غروب الشمس بين الجبال فوق مرج أخضر', wisdom: 'بعد كل غروب، يولد فجر جديد.', image: makeScene({ skyTop: '#f4b183', skyBottom: '#f7dca0', hill: '#4a7a64', accent: '#7aa66d', label: 'غروب' }) },
            { title: 'غروب على البحيرة', icon: '🌅', caption: 'غروب شاحب فوق مياه هادئة', wisdom: 'في الهدوء نرى ما تخفيه الضوضاء.', image: makeScene({ skyTop: '#99d0da', skyBottom: '#f3d0a8', hill: '#4d7282', accent: '#7dc3bf', label: 'بحيرة' }) },
            { title: 'مرج أخضر في المساء', icon: '🌾', caption: 'مرج أخضر وضباب خفيف عند الغروب', wisdom: 'الجمال يزهر حيث يجد من يرعاه.', image: makeScene({ skyTop: '#ebad6d', skyBottom: '#fbe3b2', hill: '#4e8b66', accent: '#9ecb71', label: 'مرج' }) },
            { title: 'ألوان السماء', icon: '🌤️', caption: 'سماء برتقالية فوق الأشجار', wisdom: 'لكل نهاية لونٌ يليق بها.', image: makeScene({ skyTop: '#e5896f', skyBottom: '#f9d4a8', hill: '#547d83', accent: '#ebaa79', label: 'سماء' }) },
            { title: 'غابة خضراء', icon: '🌲', caption: 'أشعة الشمس تتسلل بين أغصان الغابة', wisdom: 'القوة تنمو بصبر، مثل الأشجار.', image: makeScene({ skyTop: '#9ed4d4', skyBottom: '#dff3d4', hill: '#285f54', accent: '#82bc7f', label: 'غابة' }) },
            { title: 'قمم جبلية', icon: '🏔️', caption: 'قمم شاهقة تحت سحب بيضاء', wisdom: 'القمم العالية تبدأ بخطوة ثابتة.', image: makeScene({ skyTop: '#d9ebf5', skyBottom: '#f4efe4', hill: '#566d7a', accent: '#9baea2', label: 'قمم' }) },
            { title: 'أمواج المحيط', icon: '🌊', caption: 'أمواج زرقاء تتدحرج نحو الشاطئ', wisdom: 'المرونة قوة حين تعصف الأمواج.', image: makeScene({ skyTop: '#8ec6e4', skyBottom: '#dff4ff', hill: '#2f6d94', accent: '#7bb4d8', label: 'محيط' }) },
            { title: 'شاطئ هادئ', icon: '🏖️', caption: 'شاطئ رملي مع ماء هادئ في ضوء المساء', wisdom: 'امنح نفسك وقتًا لتستعيد هدوءك.', image: makeScene({ skyTop: '#f4b07d', skyBottom: '#f7dfb5', hill: '#d5b08b', accent: '#7bb6c6', label: 'شاطئ' }) },
            { title: 'شلال بين الصخور', icon: '💧', caption: 'ماء ينساب بين الصخور والأشجار', wisdom: 'الاستمرار يصنع طريقًا حتى في الصخر.', image: makeScene({ skyTop: '#79c7d2', skyBottom: '#d7f0f3', hill: '#3a5c50', accent: '#7cb7a9', label: 'شلال' }) },
            { title: 'صخور الصحراء', icon: '🏜️', caption: 'تكوينات صخرية واسعة في صحراء مفتوحة', wisdom: 'في أبسط الأماكن يتجلى أعمق الجمال.', image: makeScene({ skyTop: '#d9c08a', skyBottom: '#f3e1b2', hill: '#b8864e', accent: '#d7b57a', label: 'صحراء' }) },
            { title: 'حياة برية', icon: '🦌', caption: 'حيوان بري بين الجبال والأشجار', wisdom: 'احترام الحياة يبدأ بتركها تعيش بطبيعتها.', image: makeScene({ skyTop: '#c8d8be', skyBottom: '#ecf1db', hill: '#496a44', accent: '#719a66', label: 'حياة' }) },
            { title: 'أزهار برية', icon: '🌼', caption: 'أزهار صفراء تحت سماء زرقاء', wisdom: 'ازهر في مكانك، ولو كنت وحدك.', image: makeScene({ skyTop: '#a3d9f3', skyBottom: '#f9f3cc', hill: '#79a25f', accent: '#f1d35a', label: 'أزهار' }) },
            { title: 'جبال يكسوها الضباب', icon: '☁️', caption: 'جبال خضراء محاطة بالضباب عند الشروق', wisdom: 'ليس كل ما غاب عن العين قد ضاع.', image: makeScene({ skyTop: '#d8ebf0', skyBottom: '#f6f4ef', hill: '#516a6d', accent: '#a0b9b0', label: 'ضباب' }) },
            { title: 'بحيرة جبلية', icon: '🛶', caption: 'بحيرة صافية تحيط بها الجبال', wisdom: 'صفاء القلب يعكس جمال العالم.', image: makeScene({ skyTop: '#7ec2d2', skyBottom: '#eaf7ff', hill: '#527b6e', accent: '#9bd0d0', label: 'بحيرة' }) },
            { title: 'نهر وسط الغابة', icon: '🌿', caption: 'نهر يجري بين الصخور والغابة', wisdom: 'امضِ بهدوء، فلكل طريق مجراه.', image: makeScene({ skyTop: '#88d5d0', skyBottom: '#dff7f2', hill: '#3c7a6c', accent: '#6ba986', label: 'نهر' }) },
            { title: 'مناظر شتوية', icon: '❄️', caption: 'جبال ووديان مغطاة بالثلوج', wisdom: 'وراء البرد سكون يهيئ للحياة.', image: makeScene({ skyTop: '#cfe8f7', skyBottom: '#eef8ff', hill: '#6987a3', accent: '#cfdbef', label: 'ثلج' }) },
            { title: 'ألوان الخريف', icon: '🍂', caption: 'أشجار خريفية ملونة تعكسها المياه', wisdom: 'التغيير قد يكون أجمل فصول الحياة.', image: makeScene({ skyTop: '#dca873', skyBottom: '#f8d7a7', hill: '#75654e', accent: '#d3835b', label: 'خريف' }) },
            { title: 'وادي جبلي', icon: '⛰️', caption: 'وادي أخضر بين تلال جبلية', wisdom: 'بين القمم متسعٌ للطريق والأمل.', image: makeScene({ skyTop: '#adc9c4', skyBottom: '#f0f2d7', hill: '#4d7c64', accent: '#91a879', label: 'وادي' }) },
            { title: 'نباتات صحراوية', icon: '🌵', caption: 'نباتات صبار بأشواك دقيقة', wisdom: 'الصبر يزهر حتى في أقسى الظروف.', image: makeScene({ skyTop: '#f1d09e', skyBottom: '#f7e7b5', hill: '#b07d4a', accent: '#d3b976', label: 'صبار' }) },
            { title: 'جبال متدرجة', icon: '🌄', caption: 'طبقات جبلية تتدرج في الأفق', wisdom: 'كل أفق جديد يكشف طريقًا آخر.', image: makeScene({ skyTop: '#d0d9e8', skyBottom: '#f7f6f1', hill: '#5e6c7a', accent: '#a7b1bf', label: 'أفق' }) }
        ];

        const gallery = document.getElementById('gallery');

        galleryItems.forEach((item, index) => {
            const figure = document.createElement('figure');
            const img = document.createElement('img');
            const figcaption = document.createElement('figcaption');
            const captionHeader = document.createElement('div');
            const icon = document.createElement('span');
            const title = document.createElement('span');
            const link = document.createElement('a');
            const wisdom = document.createElement('span');

            img.src = item.image;
            img.alt = item.caption;
            img.loading = 'lazy';
            img.decoding = 'async';

            captionHeader.className = 'caption-header';
            icon.className = 'caption-icon';
            icon.textContent = item.icon;
            icon.setAttribute('aria-hidden', 'true');

            title.textContent = item.title;
            title.setAttribute('aria-label', item.title);

            link.className = 'wisdom-link';
            link.href = `wisdom.html?image=${index}`;
            link.textContent = 'اقرأ الحكمة';
            link.setAttribute('aria-label', `اقرأ نبذة عن حكمة ${item.title}`);

            wisdom.className = 'wisdom';
            wisdom.textContent = item.wisdom;

            captionHeader.appendChild(icon);
            captionHeader.appendChild(title);

            figcaption.appendChild(captionHeader);
            figcaption.appendChild(link);
            figcaption.appendChild(wisdom);

            figure.appendChild(img);
            figure.appendChild(figcaption);
            gallery.appendChild(figure);
        });
    </script>
</body>
</html>
