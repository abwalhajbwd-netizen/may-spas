<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f2f5f1">
    <title>مرحباً</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0 24px 48px;
            min-height: 100vh;
            color: #183b3b;
            background: #f2f5f1;
            font-family: Tahoma, Arial, sans-serif;
        }

        .ticker {
            display: block;
            width: 100vw;
            min-height: 58px;
            margin: 0 calc(50% - 50vw);
            color: #183b3b;
            background: transparent;
        }

        .ticker-track {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 58px;
        }

        .ticker-group {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-around;
            gap: 4px 12px;
            width: 100%;
            min-height: 58px;
            padding: 8px 16px;
            direction: rtl;
            white-space: nowrap;
            font-size: clamp(18px, 2.4vw, 24px);
            font-weight: 700;
        }

        .ticker-group span::after {
            margin-inline-start: 8px;
            color: #7fd04c;
            content: "✦";
        }

        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        main {
            width: min(100%, 1000px);
            margin: 0 auto;
        }

        header {
            margin-bottom: 38px;
            text-align: center;
        }

        .salawat {
            margin: 0 0 8px;
            color: #b85d3b;
            font-size: clamp(30px, 4vw, 40px);
            line-height: 1.5;
        }

        h1 {
            margin: 0;
            font-size: clamp(58px, 10vw, 92px);
            line-height: 1.2;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 22px;
        }

        figure {
            min-width: 0;
            margin: 0;
        }

        figure img {
            display: block;
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            object-position: center 55%;
            background: #d9e2dc;
        }

        figcaption {
            margin-top: 12px;
            padding: 14px 18px;
            border-radius: 8px;
            color: #fff;
            background: #183b3b;
            font-size: 20px;
            font-weight: 700;
        }

        .wisdom-link {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-inline-start: 10px;
            padding: 5px 9px;
            border: 1px solid #efb172;
            border-radius: 999px;
            color: #fff;
            font-size: 13px;
            font-weight: 400;
            text-decoration: none;
            vertical-align: middle;
        }

        .wisdom-link:hover,
        .wisdom-link:focus-visible {
            color: #183b3b;
            background: #efb172;
        }

        .wisdom {
            display: block;
            margin-top: 8px;
            color: #d7e5df;
            font-family: "Noto Naskh Arabic", Amiri, "Traditional Arabic", serif;
            font-size: 22px;
            font-weight: 600;
            line-height: 1.9;
            text-align: center;
        }

        .wisdom::before {
            margin-inline-end: 6px;
            color: #efb172;
            content: "❝";
            font-family: Georgia, serif;
            font-size: 20px;
            vertical-align: -2px;
        }

        .caption-icon {
            margin-inline-end: 10px;
            font-size: 24px;
            vertical-align: middle;
        }

        @media (max-width: 640px) {
            body { padding: 0 18px 36px; }
            .ticker { min-height: 52px; }
            .ticker-group { font-size: 18px; }
            .ticker-group span::after { margin-inline-start: 4px; }
            header { margin-bottom: 28px; }
            .gallery { grid-template-columns: 1fr; gap: 24px; }
        }
    </style>
</head>
<body>
    <div class="ticker">
        <span class="visually-hidden">الحمد لله، الشكر لله، سبحان الله وبحمده، سبحان الله العظيم</span>
        <div class="ticker-track" aria-hidden="true">
            <div class="ticker-group">
                <span>الحمد لله</span>
                <span>الشكر لله</span>
                <span>سبحان الله وبحمده</span>
                <span>سبحان الله العظيم</span>
            </div>
        </div>
    </div>

    <main>
        <header>
            <h1>مرحباً</h1>
        </header>

        <section class="gallery" id="gallery" aria-label="معرض صور الطبيعة"></section>
    </main>

    <script>
        const galleryItems = [
            { title: 'غروب بين الجبال', image: 'https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1200&q=80', alt: 'غروب الشمس بين الجبال وفوق مرج أخضر', wisdom: 'بعد كل غروب، يولد فجر جديد.' },
            { title: 'غروب على البحيرة', image: 'https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1200&q=80', alt: 'غروب الشمس فوق بحيرة هادئة', wisdom: 'في الهدوء نرى ما تخفيه الضوضاء.' },
            { title: 'غروب في مرج أخضر', image: 'https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1200&q=80', alt: 'غروب الشمس فوق مرج أخضر وضباب خفيف', wisdom: 'الجمال يزهر حيث يجد من يرعاه.' },
            { title: 'ألوان السماء وقت الغروب', image: 'https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1200&q=80', alt: 'سماء برتقالية عند الغروب فوق الأشجار', wisdom: 'لكل نهاية لونٌ يليق بها.' },
            { title: 'غابة خضراء', image: 'https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1200&q=80', alt: 'أشعة الشمس تتسلل بين أشجار الغابة', wisdom: 'القوة تنمو بصبر، مثل الأشجار.' },
            { title: 'قمم جبلية', image: 'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1200&q=80', alt: 'قمم جبلية شاهقة تحت غيوم بيضاء', wisdom: 'القمم العالية تبدأ بخطوة ثابتة.' },
            { title: 'أمواج المحيط', image: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1200&q=80', alt: 'أمواج المحيط الزرقاء عن قرب', wisdom: 'المرونة قوة حين تعصف الأمواج.' },
            { title: 'شاطئ هادئ', image: 'https://images.unsplash.com/photo-1500375592092-40eb2168fd21?auto=format&fit=crop&w=1200&q=80', alt: 'شاطئ رملي ومياه بحر في ضوء الغروب', wisdom: 'امنح نفسك وقتًا لتستعيد هدوءك.' },
            { title: 'شلال بين الصخور', image: 'https://images.unsplash.com/photo-1506748686214-e9df14d4d9d0?auto=format&fit=crop&w=1200&q=80', alt: 'شلال ينساب بين الصخور والأشجار', wisdom: 'الاستمرار يصنع طريقًا حتى في الصخر.' },
            { title: 'صخور الصحراء', image: 'https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1200&q=80', alt: 'تكوينات صخرية في صحراء واسعة', wisdom: 'في أبسط الأماكن يتجلى أعمق الجمال.' },
            { title: 'حياة برية', image: 'https://images.unsplash.com/photo-1474511320723-9a56873867b5?auto=format&fit=crop&w=1200&q=80', alt: 'حيوان بري بين الجبال والأشجار', wisdom: 'احترام الحياة يبدأ بتركها تعيش بطبيعتها.' },
            { title: 'أزهار برية', image: 'https://images.unsplash.com/photo-1466692476868-aef1dfb1e735?auto=format&fit=crop&w=1200&q=80', alt: 'أزهار برية صفراء تحت سماء زرقاء', wisdom: 'ازهر في مكانك، ولو كنت وحدك.' },
            { title: 'جبال يكسوها الضباب', image: 'https://images.unsplash.com/photo-1501854140801-50d01698950b?auto=format&fit=crop&w=1200&q=80', alt: 'ضباب يحيط بجبال خضراء وقت الشروق', wisdom: 'ليس كل ما غاب عن العين قد ضاع.' },
            { title: 'بحيرة جبلية', image: 'https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1200&q=80', alt: 'بحيرة جبلية صافية تحيط بها الجبال', wisdom: 'صفاء القلب يعكس جمال العالم.' },
            { title: 'نهر وسط الغابة', image: 'https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1200&q=80', alt: 'نهر صافٍ يجري بين الصخور والغابة', wisdom: 'امضِ بهدوء، فلكل طريق مجراه.' },
            { title: 'مناظر شتوية', image: 'https://images.unsplash.com/photo-1482192505345-5655af888cc4?auto=format&fit=crop&w=1200&q=80', alt: 'جبال ووديان تغطيها الثلوج', wisdom: 'وراء البرد سكون يهيئ للحياة.' },
            { title: 'ألوان الخريف', image: 'https://images.unsplash.com/photo-1473448912268-2022ce9509d8?auto=format&fit=crop&w=1200&q=80', alt: 'أشجار خريفية ملونة تنعكس على سطح الماء', wisdom: 'التغيير قد يكون أجمل فصول الحياة.' },
            { title: 'وادي جبلي', image: 'https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1200&q=80', alt: 'وادي أخضر بين تلال جبلية', wisdom: 'بين القمم متسعٌ للطريق والأمل.' },
            { title: 'نباتات صحراوية', image: 'https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1200&q=80', alt: 'نبات صبار بأشواك دقيقة', wisdom: 'الصبر يزهر حتى في أقسى الظروف.' },
            { title: 'جبال متدرجة', image: 'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1200&q=80', alt: 'طبقات من الجبال تتدرج في الأفق', wisdom: 'كل أفق جديد يكشف طريقًا آخر.' }
        ];

        const gallery = document.getElementById('gallery');

        galleryItems.forEach((item, index) => {
            const figure = document.createElement('figure');
            const img = document.createElement('img');
            const figcaption = document.createElement('figcaption');
            const icon = document.createElement('span');
            const title = document.createTextNode(item.title);
            const link = document.createElement('a');
            const wisdom = document.createElement('span');

            img.src = item.image;
            img.alt = item.alt;
            img.loading = 'lazy';
            img.decoding = 'async';

            icon.className = 'caption-icon';
            icon.textContent = '🌄';
            icon.setAttribute('aria-hidden', 'true');

            link.className = 'wisdom-link';
            link.href = `wisdom.html?image=${index}`;
            link.setAttribute('aria-label', `اقرأ نبذة عن حكمة ${item.title}`);
            link.textContent = 'اقرأ الحكمة';

            wisdom.className = 'wisdom';
            wisdom.textContent = item.wisdom;

            figcaption.appendChild(icon);
            figcaption.appendChild(title);
            figcaption.appendChild(link);
            figcaption.appendChild(wisdom);

            figure.appendChild(img);
            figure.appendChild(figcaption);
            gallery.appendChild(figure);
        });
    </script>
</body>
</html>
